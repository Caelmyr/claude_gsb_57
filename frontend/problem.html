<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目详情 - 在线代码评测与竞赛系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container" style="max-width:960px">
    <div id="problemBody"></div>

    <div class="card" id="solutionCard" style="display:none">
      <div class="card-title">📖 官方题解 <span id="solPublishBtn"></span></div>
      <div id="solutionList"></div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    OJ.boot("index");
    const pid = new URLSearchParams(location.search).get("id");

    function renderMarkdownish(text) {
      // 简单段落化：空行分段，保留行内 code
      if (!text) return '<span class="muted">（无）</span>';
      const esc = OJ.esc;
      const paras = text.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
      return paras;
    }

    async function load() {
      if (!pid) { OJ.el("problemBody").innerHTML = '<div class="empty">缺少题目参数</div>'; return; }
      const box = OJ.el("problemBody");
      box.innerHTML = '<div class="empty"><span class="spinner"></span> 加载题目…</div>';
      try {
        const p = await OJ.api("/problems/" + pid);
        const samples = (p.samples || []).map((s, i) => `
          <div class="form-group">
            <label>样例 ${i + 1}</label>
            <pre class="code light">${OJ.esc(s.input)}</pre>
            <label class="mt-8">输出</label>
            <pre class="code light">${OJ.esc(s.output)}</pre>
          </div>`).join("");

        box.innerHTML = `
          <div class="page-head">
            <div>
              <h1>${OJ.esc(p.title)} ${OJ.difficultyLabel(p.difficulty)}</h1>
              <div class="sub">
                时间限制 <b>${p.time_limit_ms} ms</b> · 内存限制 <b>${Math.round(p.memory_limit_kb / 1024)} MB</b> · 分值 <b>${p.points}</b>
              </div>
            </div>
            <button class="btn btn-primary btn-lg" onclick="location.href='/editor.html?id=${OJ.esc(p.id)}'">✏️ 提交代码</button>
          </div>

          <div class="card">
            <div class="card-title">题目描述</div>
            ${renderMarkdownish(p.description)}
          </div>

          <div class="card">
            <div class="card-title">输入描述</div>
            ${renderMarkdownish(p.input_description)}
          </div>

          <div class="card">
            <div class="card-title">输出描述</div>
            ${renderMarkdownish(p.output_description)}
          </div>

          <div class="card">
            <div class="card-title">样例</div>
            ${samples}
          </div>

          ${p.hint ? `<div class="card"><div class="card-title">提示</div>${renderMarkdownish(p.hint)}</div>` : ""}

          <div class="card">
            <div class="card-title">标签</div>
            <div>${(p.tags || []).map(t => `<span class="tag">${OJ.esc(t)}</span>`).join("")}</div>
          </div>

          <div class="flex gap-8 wrap">
            <button class="btn btn-outline" onclick="history.back()">← 返回列表</button>
            <a class="btn btn-outline" href="/forum.html?problem_id=${OJ.esc(p.id)}">💬 讨论该题</a>
          </div>`;
      } catch (e) {
        box.innerHTML = `<div class="empty">${OJ.esc(e.message)}</div>`;
      }
    }
    /* ---------- 官方题解 ---------- */
    let solCache = {};

    // 管理员或授权用户（judge 角色）可发布/管理题解
    function canManageSolutions() {
      const u = OJ.currentUser();
      return u && (u.role === "admin" || u.role === "judge");
    }

    function canEditSolution(s) {
      const u = OJ.currentUser();
      return u && (u.role === "admin" || (u.role === "judge" && s.author === u.id));
    }

    async function loadSolutions() {
      if (!pid) return;
      const card = OJ.el("solutionCard");
      const box = OJ.el("solutionList");
      card.style.display = "";
      OJ.el("solPublishBtn").innerHTML = canManageSolutions()
        ? `<button class="btn btn-primary btn-sm" onclick="openSolutionEditor()">＋ 发布题解</button>` : "";
      try {
        const data = await OJ.api("/problems/" + pid + "/solutions");
        if (data.hidden) {
          box.innerHTML = `<div class="empty">🔒 该题已加入未结束的竞赛「${OJ.esc(data.contest_title || "")}」，题解将在比赛结束（${OJ.fmtTime(data.contest_end_time)}）后公开。</div>`;
          return;
        }
        solCache = {};
        (data.items || []).forEach(s => { solCache[s.id] = s; });
        if (!data.items.length) { box.innerHTML = `<div class="empty">暂无题解</div>`; return; }
        box.innerHTML = data.items.map(s => `
          <div class="thread">
            <div>
              <a class="t-title" style="cursor:pointer" onclick="viewSolution('${OJ.esc(s.id)}')">📖 ${OJ.esc(s.title)}</a>
              ${canEditSolution(s) ? `
                <button class="btn btn-outline btn-sm" style="margin-left:8px" onclick="openSolutionEditor('${OJ.esc(s.id)}')">编辑</button>
                <button class="btn btn-danger btn-sm" onclick="delSolution('${OJ.esc(s.id)}')">删除</button>` : ""}
            </div>
            <div class="t-meta">${OJ.esc(s.author_name)} · ${OJ.fmtTime(s.created_at)}${s.updated_at && s.updated_at !== s.created_at ? " · 更新于 " + OJ.fmtTime(s.updated_at) : ""}</div>
          </div>`).join("");
      } catch (e) { box.innerHTML = `<div class="empty">${OJ.esc(e.message)}</div>`; }
    }

    function viewSolution(id) {
      const s = solCache[id];
      if (!s) return;
      const mask = OJ.openModal(s.title, `
        <div class="muted" style="font-size:12px;margin-bottom:12px">${OJ.esc(s.author_name)} · ${OJ.fmtTime(s.created_at)}</div>
        ${renderMarkdownish(s.content)}`);
      mask.querySelector(".modal").style.maxWidth = "760px";
    }

    function openSolutionEditor(id) {
      const s = id ? solCache[id] : null;
      const body = `
        <div class="form-group"><label>标题</label><input id="sol_title" value="${s ? OJ.esc(s.title) : ""}"></div>
        <div class="form-group"><label>内容（空行分段）</label><textarea id="sol_content" rows="10">${s ? OJ.esc(s.content) : ""}</textarea></div>`;
      const mask = OJ.openModal(s ? "编辑题解" : "发布题解", body);
      mask.querySelector(".modal").style.maxWidth = "720px";
      mask.querySelector(".modal-actions").innerHTML = `
        <button class="btn btn-outline" onclick="this.closest('.modal-mask').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveSolution('${s ? OJ.esc(s.id) : ""}')">${s ? "保存" : "发布"}</button>`;
    }

    async function saveSolution(id) {
      const body = {
        title: document.getElementById("sol_title").value.trim(),
        content: document.getElementById("sol_content").value.trim(),
      };
      if (!body.title || !body.content) { OJ.toast("标题和内容不能为空", "error"); return; }
      try {
        if (id) await OJ.api("/problems/" + pid + "/solutions/" + id, { method: "PUT", body });
        else await OJ.api("/problems/" + pid + "/solutions", { method: "POST", body });
        OJ.toast(id ? "已保存" : "发布成功", "success");
        document.querySelector(".modal-mask").remove();
        loadSolutions();
      } catch (e) { OJ.toast(e.message, "error"); }
    }

    async function delSolution(id) {
      if (!await OJ.confirmDialog("确定删除该题解？")) return;
      try {
        await OJ.api("/problems/" + pid + "/solutions/" + id, { method: "DELETE" });
        OJ.toast("已删除", "success");
        loadSolutions();
      } catch (e) { OJ.toast(e.message, "error"); }
    }

    load();
    loadSolutions();
  </script>
</body>
</html>
